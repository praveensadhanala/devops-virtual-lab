name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devops-lab-app:secure ./app

      - name: Scan Dockerfile Configuration
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            aquasec/trivy:latest config /work/app

      - name: Scan Filesystem for Vulnerabilities
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            aquasec/trivy:latest fs \
            --scanners vuln,secret \
            /work

      - name: Scan Docker Image for Vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            devops-lab-app:secure

      - name: Verify Kubernetes Files
        run: |
          test -f k8s/deployment.yml
          test -f k8s/service.yml
          echo "Kubernetes manifests found successfully"
